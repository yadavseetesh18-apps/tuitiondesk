<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TuitionDesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F4EE;--card:#FFFFFF;--ink:#1D2547;--mute:#6A6F85;--line:#E3E0D6;--accent:#23305E;--onaccent:#fff;--gold:#F0A21B;--green:#1E8E5A;--greenbg:#DDF1E6;--red:#C8452F;--redbg:#FBE4DE;--amber:#8A5A00;--amberbg:#FDF0D0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141829;--card:#1D2238;--ink:#EEF0F8;--mute:#9AA0BA;--line:#2C3250;--accent:#F0A21B;--onaccent:#1D2547;--gold:#F0A21B;--green:#4FC48A;--greenbg:#173A2B;--red:#F08A74;--redbg:#44221B;--amber:#F0C36A;--amberbg:#3F3213}}
:root[data-theme="dark"]{--bg:#141829;--card:#1D2238;--ink:#EEF0F8;--mute:#9AA0BA;--line:#2C3250;--accent:#F0A21B;--onaccent:#1D2547;--gold:#F0A21B;--green:#4FC48A;--greenbg:#173A2B;--red:#F08A74;--redbg:#44221B;--amber:#F0C36A;--amberbg:#3F3213}
*{box-sizing:border-box;margin:0}
html{color-scheme:light dark}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 Hind,system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;min-height:100vh}
h1,h2,h3,.num{font-family:'Bricolage Grotesque',Hind,system-ui,sans-serif;letter-spacing:-.01em}
header{padding:16px 18px 6px;display:flex;justify-content:space-between;align-items:baseline}
header h1{font-size:22px}header small{color:var(--mute);font-size:13px}
main{padding:8px 16px 16px}
h2{font-size:20px;margin:6px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.hero{background:var(--accent);color:var(--onaccent);border:0}
.hero .num{font-size:38px;line-height:1.1}
.hero small{opacity:.8}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.row+.row{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.mute{color:var(--mute);font-size:14px}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--amberbg);color:var(--amber);white-space:nowrap}
.chip.red{background:var(--redbg);color:var(--red)}.chip.green{background:var(--greenbg);color:var(--green)}
button,.btn{font:600 16px Hind,sans-serif;border:0;border-radius:12px;padding:13px 16px;background:var(--accent);color:var(--onaccent);width:100%;cursor:pointer;text-decoration:none;display:block;text-align:center}
button.small,.btn.small{width:auto;padding:7px 12px;font-size:14px;display:inline-block}
.btn.wa{background:#1FA855;color:#fff}
.btn.ghost,button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,.btn:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pa{display:flex;gap:6px}
.pa button{width:44px;height:44px;padding:0;border-radius:10px;background:transparent;color:var(--mute);border:1.5px solid var(--line)}
.pa button.p.on{background:var(--green);border-color:var(--green);color:#fff}
.pa button.a.on{background:var(--red);border-color:var(--red);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chips button{width:auto;white-space:nowrap;padding:8px 14px;background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:14.5px}
.chips button.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}
.bars div.c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--mute)}
.bars i{display:block;width:100%;border-radius:6px 6px 0 0;background:var(--line)}
.bars .c.last i{background:var(--gold)}.bars b{font-size:13px;color:var(--ink);margin-bottom:3px}
.split{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--line);margin:10px 0 6px}
.split i{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .card{margin:0}.grid .num{font-size:28px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mute);padding:9px 2px;font-size:13px;border-radius:10px;position:relative}
nav button.on{color:var(--ink);font-weight:600}
nav button.on::after{content:"";position:absolute;left:30%;right:30%;top:0;height:3px;border-radius:3px;background:var(--gold)}
.sheetbg{position:fixed;inset:0;background:rgba(10,14,30,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheetbg.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto}
.sheet .row .btn{min-width:84px}.sent{opacity:.6}
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--green)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
select{font:500 16px Hind,sans-serif;width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:12px}
input,textarea{font:500 16px Hind,sans-serif;width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:4px 0 10px}
input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.row label{margin:0}.row input{margin:0}
</style>
</head>
<body>
<header><h1>TuitionDesk</h1><small id="who"></small></header>
<main id="main"></main>
<nav id="nav"></nav>
<div class="sheetbg" id="sbg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var NOW=new Date();NOW.setHours(0,0,0,0);
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],MAX=50,BATCH='Today’s batch';
var DB=null,OWNER=false,S=[],ENQ=[],CFG={name:'',upi:'',collected:0},st={tab:'parent',att:{},sel:null,pv:null,pcode:''},READY=false,LOADED=false;
var $=function(i){return document.getElementById(i)};
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function inr(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function late(s){return s.due?Math.max(0,Math.round((NOW-new Date(s.due))/864e5)):0}
function dfmt(s){var d=new Date(s);return d.getDate()+' '+MON[d.getMonth()]}
function cname(){return CFG.name||'our tuition centre'}
function wa(ph,msg){return 'https://wa.me/'+ph+'?text='+encodeURIComponent(msg)}
function toast(t){var e=$('toast');e.textContent=t;e.className='toast show';setTimeout(function(){e.className='toast'},2400)}
function sheet(title,html){$('sheet').innerHTML='<h2>'+title+'</h2>'+html+'<button class="ghost" style="margin-top:12px" onclick="closeSheet()">Close</button>';$('sbg').className='sheetbg open'}
function closeSheet(){$('sbg').className='sheetbg'}
$('sbg').addEventListener('click',function(e){if(e.target===this)closeSheet()});
function go(t){st.tab=t;render()}
function sentLink(el){el.parentNode.parentNode.classList.add('sent');el.textContent='Sent'}
function pending(){return S.filter(function(s){return s.fee>0}).sort(function(a,b){return late(b)-late(a)})}
function lastSc(s){return (s.sc||[]).length?s.sc[s.sc.length-1]:0}
function rank(s){return S.slice().sort(function(a,b){return lastSc(b)-lastSc(a)}).map(function(x){return x.id}).indexOf(s.id)+1}
function me(){var f=S.filter(function(s){return s.id===st.sel})[0];return f||S[0]}
function newCode(){var c='ABCDEFGHJKMNPQRSTUVWXYZ23456789',o='';for(var i=0;i<6;i++)o+=c[Math.floor(Math.random()*c.length)];return o}
function recOf(s){var r={};['n','par','ph','fee','due','att','sc','hw','code'].forEach(function(k){r[k]=s[k]});return r}
function pvOf(s){return {n:s.n,att:s.att,sc:s.sc,hw:s.hw,fee:s.fee,due:s.due||'',upi:CFG.upi||'',centre:CFG.name||''}}
function save(s){return Promise.all([DB.doc('students/'+s.id).set(recOf(s)),DB.doc('pv/'+s.code).set(pvOf(s))])}
function fail(e){toast('Could not save. '+(e&&e.code==='quota_exceeded'?'Storage is full.':'Check your connection and try again.'))}
function saveCfg(){return DB.doc('cfg/main').set(CFG)}

/* Empty state */
function empty(){return '<div class="card"><h3>No students yet</h3><p class="mute" style="margin:6px 0 12px">Add your first student, or load 10 sample students to try the app.</p><button onclick="addStudent()" style="margin-bottom:8px">Add student</button><button class="ghost" onclick="seed()">Load sample students</button></div>'}
function gate(){if(!DB)return '<div class="card"><h3>Sign in to use TuitionDesk</h3><p class="mute" style="margin-top:6px">Open this page from its Claude link while signed in. Saved data works only there.</p></div>';if(!LOADED)return '<p class="mute">Loading…</p>';return ''}

/* Fees */
function fees(){var g=gate();if(g)return g;if(!S.length)return empty();var p=pending(),tot=p.reduce(function(a,s){return a+s.fee},0);
var h='<div class="card hero"><small>Pending fees</small><div class="num">'+inr(tot)+'</div><small>'+p.length+' students owe fees</small></div>';
h+='<button onclick="remindAll()" style="margin-bottom:12px;background:#1FA855;color:#fff">Send WhatsApp reminder to all</button><div class="card">';
if(!p.length)h+='<p class="mute">All fees are paid. Nothing to chase today.</p>';
p.forEach(function(s){var d=late(s);h+='<div class="row"><div><b>'+esc(s.n)+'</b><div class="mute">Due '+dfmt(s.due)+(s.paidPart>0?' · '+inr(s.paidPart)+' paid':'')+'</div></div><div style="text-align:right"><b class="num">'+inr(s.fee)+'</b><div><span class="chip'+(d>14?' red':'')+'">'+d+' days late</span> <button class="small ghost" onclick="markPaid(\''+s.id+'\')">Paid</button> <button class="small ghost" onclick="partPay(\''+s.id+'\')">Part</button></div></div></div>'});
return h+'</div>'}
function remindMsg(s){return 'Dear '+s.par+', a gentle reminder from '+cname()+': '+s.n+'’s fee of '+inr(s.fee)+' was due on '+dfmt(s.due)+' ('+late(s)+' days ago).'+(CFG.upi?' You can pay by UPI to '+CFG.upi+'.':'')+' Thank you!'}
function remindAll(){var h='<p class="mute" style="margin-bottom:8px">WhatsApp opens one chat at a time. Tap Send for each parent.</p><div class="card">';
pending().forEach(function(s){h+='<div class="row"><div><b>'+esc(s.par)+'</b><div class="mute">'+esc(s.n)+' · '+inr(s.fee)+'</div></div><a class="btn wa small" target="_blank" rel="noopener" href="'+wa(s.ph,remindMsg(s))+'" onclick="sentLink(this)">Send</a></div>'});
sheet('Fee reminders',h+'</div>')}
function markPaid(id){var s=S.filter(function(x){return x.id===id})[0];if(!s||!confirm('Mark '+s.n+'’s '+inr(s.fee)+' as paid?'))return;
CFG.collected=(CFG.collected||0)+s.fee;s.fee=0;s.due='';Promise.all([save(s),saveCfg()]).then(function(){toast('Payment recorded')}).catch(fail)}

/* Attendance */
function attendance(){var g=gate();if(g)return g;if(!S.length)return empty();
var h='<h2>'+BATCH+'</h2><p class="mute" style="margin:-6px 0 10px">'+dfmt(NOW)+'</p><div class="card">';
S.forEach(function(s){var v=st.att[s.id];h+='<div class="row"><b>'+esc(s.n)+'</b><div class="pa"><button class="p'+(v==='P'?' on':'')+'" aria-label="Present" onclick="mark(\''+s.id+'\',\'P\')">P</button><button class="a'+(v==='A'?' on':'')+'" aria-label="Absent" onclick="mark(\''+s.id+'\',\'A\')">A</button></div></div>'});
var m=S.filter(function(s){return st.att[s.id]}).length;
return h+'</div><button onclick="saveAtt()">Save attendance ('+m+'/'+S.length+' marked)</button>'}
function mark(id,v){st.att[id]=v;render()}
function saveAtt(){var un=S.filter(function(s){return !st.att[s.id]});if(un.length){toast('Mark all students first: '+un.length+' left');return}
var ab=[];S.forEach(function(s){s.att=[(s.att[0]||0)+(st.att[s.id]==='P'?1:0),(s.att[1]||0)+1];if(st.att[s.id]==='A')ab.push(s)});
Promise.all(S.map(save)).then(function(){st.att={};render();
if(!ab.length){toast('Saved. Everyone was present');return}
var h='<p class="mute" style="margin-bottom:8px">Attendance saved. Send an absent alert to each parent.</p><div class="card">';
ab.forEach(function(s){h+='<div class="row"><div><b>'+esc(s.par)+'</b><div class="mute">'+esc(s.n)+' was absent</div></div><a class="btn wa small" target="_blank" rel="noopener" href="'+wa(s.ph,'Dear '+s.par+', '+s.n+' was absent from today’s class at '+cname()+' ('+dfmt(NOW)+'). Please let us know if all is well.')+'" onclick="sentLink(this)">Send</a></div>'});
sheet('Absent alerts',h+'</div>')}).catch(fail)}

/* Tests */
function tests(){var g=gate();if(g)return g;if(!S.length)return empty();var s=me(),sc=(s.sc||[]),last=lastSc(s),d=sc.length>1?last-sc[sc.length-2]:0;
var h='<div class="chips">';S.forEach(function(x){h+='<button class="'+(s.id===x.id?'on':'')+'" onclick="st.sel=\''+x.id+'\';render()">'+esc(x.n.split(' ')[0])+'</button>'});h+='</div>';
h+='<div class="card hero"><small>'+esc(s.n)+' · this week</small><div class="row" style="border:0;margin:0;padding:0"><div class="num">'+last+'/'+MAX+'</div><div style="text-align:right"><div class="num">#'+rank(s)+'</div><small>of '+S.length+' in class</small></div></div><small>'+(sc.length>1?(d>=0?'Up ':'Down ')+Math.abs(d)+' marks from last week':'First test recorded')+'</small></div>';
h+='<div class="card"><h3>Last 6 tests</h3><div class="bars">';
sc.slice(-6).forEach(function(v,i,a){h+='<div class="c'+(i===a.length-1?' last':'')+'"><b>'+v+'</b><i style="height:'+(v/MAX*100)+'%"></i>T'+(sc.length-a.length+i+1)+'</div>'});
if(!sc.length)h+='<p class="mute">No scores yet.</p>';
h+='</div></div><a class="btn wa" target="_blank" rel="noopener" style="margin-bottom:8px" href="'+wa(s.ph,cname()+' · Weekly report\n'+s.n+'\nScore: '+last+'/'+MAX+'\nRank: '+rank(s)+' of '+S.length+'\nLast tests: '+sc.slice(-6).join(', '))+'">Share report on WhatsApp</a><button class="ghost" onclick="addScores()">Enter this week’s scores</button>';return h}
function addScores(){var h='<p class="mute" style="margin-bottom:8px">Marks out of '+MAX+'. Leave blank to skip a student.</p><div class="card">';
S.forEach(function(s){h+='<div class="row"><label for="sc_'+s.id+'">'+esc(s.n)+'</label><input id="sc_'+s.id+'" type="number" inputmode="numeric" min="0" max="'+MAX+'" style="width:80px"></div>'});
sheet('New test scores',h+'</div><button style="margin-top:10px" onclick="saveScores()">Save scores</button>')}
function saveScores(){var j=[];S.forEach(function(s){var v=$('sc_'+s.id).value;if(v!==''){v=Math.min(MAX,Math.max(0,+v));s.sc=(s.sc||[]).concat([v]).slice(-6);j.push(save(s))}});
if(!j.length){toast('Enter at least one score');return}Promise.all(j).then(function(){closeSheet();toast('Scores saved')}).catch(fail)}

/* Parent view */
function parentTab(){var p=st.pv,h='';
if(!p){h='<div class="card"><h3>Parent login</h3><p class="mute" style="margin:6px 0 10px">Enter the 6-character code given by your tuition centre.</p><input id="pcode" maxlength="6" autocapitalize="characters" placeholder="e.g. K7M2QX" value="'+esc(st.pcode)+'" style="margin-bottom:10px;text-transform:uppercase"><button onclick="loadPV($(\'pcode\').value)">View my child</button></div>';return h}
var pc=p.att[1]?Math.round(p.att[0]/p.att[1]*100):0,d=late(p);
h+='<div class="row" style="border:0;margin:0 0 10px"><h2 style="margin:0">'+esc(p.n)+(p.batchName?' <span class="chip">'+esc(p.batchName)+'</span>':'')+'</h2></div>';
h+='<div class="card"><div class="row" style="border:0;margin:0;padding:0"><span class="mute">Attendance</span><b class="num" style="font-size:28px">'+pc+'%</b></div><div class="prog"><i style="width:'+pc+'%"></i></div><p class="mute" style="margin-top:6px">'+p.att[0]+' of '+p.att[1]+' classes attended</p></div>';
h+='<div class="card"><h3>Homework</h3>';(p.hw||[]).forEach(function(x){h+='<div class="row"><span>'+esc(x)+'</span></div>'});if(!(p.hw||[]).length)h+='<p class="mute">No homework right now.</p>';h+='</div>';
if(p.fee>0){h+='<div class="card"><div class="row" style="border:0;margin:0;padding:0"><div><div class="mute">Fee due</div><b class="num" style="font-size:28px">'+inr(p.fee)+'</b></div><span class="chip red">'+d+' days late</span></div>';
h+=p.upi?'<a class="btn" style="margin-top:12px" href="upi://pay?pa='+encodeURIComponent(p.upi)+'&pn='+encodeURIComponent(p.centre||'Tuition')+'&am='+p.fee+'&cu=INR&tn='+encodeURIComponent(p.n+' fee')+'" onclick="toast(\'Opening your UPI app…\')">Pay '+inr(p.fee)+' by UPI</a><p class="mute" style="margin-top:8px;text-align:center">Works on a phone with a UPI app installed</p>':'<p class="mute" style="margin-top:8px">The centre has not added a UPI ID yet. Please pay at the centre.</p>';h+='</div>'}
else h+='<div class="card"><span class="chip green">Fees paid</span><p class="mute" style="margin-top:6px">No fee due. Thank you!</p></div>';
return h+'<button class="ghost" onclick="loadAll()">Refresh</button>'}
function loadPV(c){c=(c||'').trim().toUpperCase();if(!c)return;if(!DB){toast('Not signed in');return}
DB.doc('pv/'+c).get().then(function(d){if(!d.exists){toast('Code not found. Check with your tuition centre');return}st.pv=d.data();st.pcode=c;try{localStorage.setItem('td_code',c)}catch(e){}render()}).catch(function(){toast('Could not load. Try again')})}

/* Owner */
function owner(){var g=gate();if(g)return g;var tot=pending().reduce(function(a,s){return a+s.fee},0),col=CFG.collected||0,all=col+tot,cp=all?Math.round(col/all*100):0;
var h='<div class="card"><h3>Fees collected vs pending</h3><div class="split"><i style="width:'+cp+'%;background:var(--green)"></i><i style="width:'+(100-cp)+'%;background:var(--red)"></i></div><div class="row" style="border:0;margin:0;padding:0"><div><b class="num" style="font-size:22px;color:var(--green)">'+inr(col)+'</b><div class="mute">Collected</div></div><div style="text-align:right"><b class="num" style="font-size:22px;color:var(--red)">'+inr(tot)+'</b><div class="mute">Pending</div></div></div></div>';
h+='<div class="grid"><div class="card"><div class="num">'+S.length+'</div><div class="mute">Students</div></div><div class="card"><div class="num">'+pending().length+'</div><div class="mute">Fees pending</div></div></div>';
h+='<h2 style="margin-top:16px">Referral enquiries</h2><div class="card">';if(!ENQ.length)h+='<p class="mute">No enquiries yet.</p>';
ENQ.forEach(function(r){h+='<div class="row"><div><b>'+esc(r.n)+'</b><div class="mute">'+esc(r.cls)+' · via '+esc(r.by)+'</div></div><div style="text-align:right"><span class="chip'+(r.st==='New'?' red':' green')+'">'+esc(r.st)+'</span><div style="margin-top:6px"><a class="btn wa small" target="_blank" rel="noopener" href="'+wa(r.ph,'Hello! Thank you for your interest in '+cname()+'. When can we schedule a free demo class for '+r.n+'?')+'" onclick="enqDone(\''+r.id+'\')">WhatsApp</a></div></div></div>'});
h+='</div><button class="ghost" onclick="addEnq()">Add enquiry</button><h2 style="margin-top:16px">Students and parent codes</h2><div class="card">';
S.forEach(function(s){h+='<div class="row"><div><b>'+esc(s.n)+'</b><div class="mute">'+esc(s.par)+'</div></div><div style="text-align:right"><b class="num">'+esc(s.code)+'</b><div><a class="btn wa small" target="_blank" rel="noopener" href="'+wa(s.ph,'Dear '+s.par+', your TuitionDesk code for '+s.n+' at '+cname()+' is '+s.code+'. Open the TuitionDesk link and enter this code to see attendance, homework and fees.')+'">Share code</a></div></div></div>'});
if(!S.length)h+='<p class="mute">No students yet.</p>';
return h+'</div><button onclick="addStudent()" style="margin-bottom:8px">Add student</button><button class="ghost" style="margin-bottom:8px" onclick="postHW()">Post homework to all</button><button class="ghost" onclick="settings()">Centre name and UPI ID</button>'}

/* Billing on each student's joining-date day */
function dayOf(s){return s.join?+s.join.slice(8,10):0}
function ymd(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function cyc(join,y,m){var dim=new Date(y,m+1,0).getDate();return ymd(y,m,Math.min(+join.slice(8,10),dim))}
function nextCyc(x){if(!x.lastBilled)return x.join;var d=new Date(+x.lastBilled.slice(0,4),+x.lastBilled.slice(5,7),1);return cyc(x.join,d.getFullYear(),d.getMonth())}
function latestCyc(join){var t=today(),x={join:join,lastBilled:''},n=nextCyc(x),last=null,g=0;while(n<=t&&g++<600){last=n;x.lastBilled=n;n=nextCyc(x)}return last}
function billUpdates(){var q=[],n=0,t=today();
S.forEach(function(s){if(!(s.monthly>0)||!s.join)return;var c=0,first=null,last=null,x={join:s.join,lastBilled:s.lastBilled},nx=nextCyc(x),g=0;
while(nx<=t&&g++<600){if(!first)first=nx;last=nx;c++;x.lastBilled=nx;nx=nextCyc(x)}
if(!c)return;n++;var u=sb.from('students').update({fee_pending:s.fee+c*s.monthly,fee_due:(s.fee>0&&s.due)?s.due:first,last_billed:last}).eq('id',s.id);
q.push(s.lastBilled?u.eq('last_billed',s.lastBilled):u.is('last_billed',null))});
return {q:q,n:n}}

/* Advance fees: each student has a next due date on his joining-date day */
function overdue(o){var c=0,d=o.nextDue,a=o.join||o.nextDue,g=0;while(d&&d<=today()&&g++<600){c++;d=nextCyc({join:a,lastBilled:d})}return c}
function afterToday(join){var n=join||today(),g=0;while(n<=today()&&g++<600)n=nextCyc({join:join||today(),lastBilled:n});return n}
function build(x,att,sc,hw){var o=build0(x,att,sc,hw);o.nextDue=x.next_due||'';o.batchId=x.batch_id||'';o.join=x.join_date||'';o.cycles=overdue(o);o.paidPart=x.paid_part||0;var ok=o.monthly>0&&o.nextDue&&o.cycles>0;o.fee=ok?Math.max(0,o.cycles*o.monthly-o.paidPart):0;o.due=ok&&o.cycles>0?o.nextDue:'';return o}
function markPaid(id){var s=sById(id);if(!s||!s.nextDue)return;
if(!confirm('Mark '+inr(s.monthly)+' as paid for '+s.n+'?'+(s.cycles>1?' ('+s.cycles+' months are pending, this clears one month.)':'')))return;
var nx=nextCyc({join:s.join||s.nextDue,lastBilled:s.nextDue});
w([sb.from('payments').insert({centre_id:CENTRE.id,student_id:id,amount:s.monthly}),sb.from('students').update({next_due:nx}).eq('id',id).eq('next_due',s.nextDue)]).then(function(ok){if(ok)toast('Paid. Next due '+dfmt(nx))})}

/* Part payments: paid_part = amount already received toward the current month */
function partPay(id){var s=sById(id);if(!s)return;sheet('Part payment','<p class="mute" style="margin-bottom:8px">'+esc(s.n)+' owes '+inr(s.fee)+(s.paidPart>0?' (already paid '+inr(s.paidPart)+' this month)':'')+'</p><div class="card"><label class="mute" for="pp">Amount received now (₹)</label><input id="pp" type="number" inputmode="numeric" max="'+s.fee+'"></div><button onclick="doPart(\''+id+'\')">Record payment</button>')}
async function doPart(id){var s=sById(id),a=+$('pp').value;if(!(a>0)||a>s.fee){toast('Enter an amount up to '+inr(s.fee));return}
var pp=s.paidPart+a,nd=s.nextDue,g=0;while(s.monthly>0&&pp>=s.monthly&&g++<600){pp-=s.monthly;nd=nextCyc({join:s.join||s.nextDue,lastBilled:nd})}
var left=s.fee-a;if(await w([sb.from('payments').insert({centre_id:CENTRE.id,student_id:id,amount:a}),sb.from('students').update({next_due:nd,paid_part:pp}).eq('id',id).eq('next_due',s.nextDue)])){closeSheet();toast(left>0?'Recorded. '+inr(left)+' still due':'Fully paid. Next due '+dfmt(nd))}}
function markPaid(id){var s=sById(id);if(!s||!s.nextDue)return;var rest=s.monthly-s.paidPart;
if(!confirm('Mark this month’s fee as paid for '+s.n+'? Receiving '+inr(rest)+'.'+(s.cycles>1?' ('+s.cycles+' months are pending, this clears one.)':'')))return;
var nx=nextCyc({join:s.join||s.nextDue,lastBilled:s.nextDue}),q=[sb.from('students').update({next_due:nx,paid_part:0}).eq('id',id).eq('next_due',s.nextDue)];
if(rest>0)q.unshift(sb.from('payments').insert({centre_id:CENTRE.id,student_id:id,amount:rest}));
w(q).then(function(ok){if(ok)toast('Paid. Next due '+dfmt(nx))})}

function editFee(id){var s=sById(id);if(!s)return;sheet('Edit · '+esc(s.n),'<div class="card"><label class="mute" for="m6">Batch</label><select id="m6">'+bOpts(s.batchId)+'</select><label class="mute" for="m1">Monthly fee (₹)</label><input id="m1" type="number" inputmode="numeric" value="'+s.monthly+'"><label class="mute" for="m3">Joining date</label><input id="m3" type="date" value="'+esc(s.join)+'"><label class="mute" for="m5">Next fee due date</label><input id="m5" type="date" value="'+(s.nextDue||afterToday(s.join))+'"></div><button onclick="doEditFee(\''+id+'\')">Save</button>')}
async function doEditFee(id){var mf=Math.max(0,+$('m1').value||0),jd=$('m3').value,nd=$('m5').value;if(!jd||!nd){toast('Pick the joining date and the next due date');return}
if(await w([sb.from('students').update({monthly_fee:mf,join_date:jd,next_due:nd,batch_id:$('m6').value||null}).eq('id',id)])){closeSheet();toast('Saved')}}
function postHW(){sheet('Post homework','<div class="card"><label class="mute" for="hb">For</label><select id="hb"><option value="">All batches</option>'+BATCHES.map(function(b){return '<option value="'+b.id+'"'+(st.bf===b.id?' selected':'')+'>'+esc(b.name)+'</option>'}).join('')+'</select><label class="mute" for="hw">Homework</label><textarea id="hw" rows="3" placeholder="e.g. Algebra ex. 4.2, Q1–10 (due Friday)"></textarea></div><button onclick="doHW()">Post to parents</button>')}
async function doHW(){var t=$('hw').value.trim();if(!t){toast('Write the homework first');return}if(await w([sb.from('homework').insert({centre_id:CENTRE.id,text:t,batch_id:$('hb').value||null})])){closeSheet();toast('Homework posted')}}
function owner(){var keep=S,h;S=ALLS;try{h=ownerOld()}finally{S=keep}return h.replace('<h2 style="margin-top:16px">Students</h2>',batchSection()+'<h2 style="margin-top:16px">Students</h2>')}
(function(){if(!window.supabase){render();return}
sb=supabase.createClient(SB_URL,SB_KEY);DB=sb;
sb.auth.onAuthStateChange(function(ev,ses){USER=ses?ses.user:null;OWNER=!!(USER&&USER.email);LOADED=false;S=[];KIDS=[];st.tab=OWNER?'fees':'parent';render();if(USER)setTimeout(loadAll,0)});
render()})();
</script>
